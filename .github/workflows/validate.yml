name: Validate plugins

on:
  pull_request:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate every plugin (manifest, files, version bumps)
        run: node scripts/registry.mjs check
      - name: Pack (dry run)
        run: node scripts/registry.mjs build dist
